[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn-operator-dataflow-metaflow"
version = "0.3.0"
description = "The Metaflow dataflow engine (ADR-0089) for cairn's ml and data flows — offered by cairndev[metaflow] (ADR-0134 D2)."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.12"
# No hard dependency on `metaflow`: the engine and the bridges import it lazily, so this wheel
# imports and registers without it (its tests run that way). `cairndev[metaflow]` installs
# both; installing this wheel alone, add the extra below.
dependencies = []

[project.optional-dependencies]
# The ADR-0083 scale rung, serving BOTH flow kinds through one adapter. Needs NO Argo/Step
# Functions: local run, `resume` and `@retry` verified standalone on 2026-07-27. Production adds
# a shared S3 datastore + metadata service.
metaflow = ["metaflow>=2.12"]

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

# #1512 — core selects an engine by NAME through this group and never imports this pack.
[project.entry-points."cairn.dataflow_engines"]
"metaflow" = "operator_dataflow_metaflow.factory:metaflow_engine"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_dataflow_metaflow"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_dataflow_metaflow/pack.toml"
