# obs-operator-audit-store — declarative manifest (ADR-0028).
#
# Zero-dependency hash-chained append-only audit sink. Backs the substrate's
# `audit` service (capability `audit.sink`). The storage logic lives in this
# operator pack — core (cairn/core/obs/audit.py) holds only the AuditSink
# interface, the AuditEvent shape, and the emission seams. Richer sinks ship
# later as `operator-audit-otel` / `-immudb` / `-siem` (official); this is the
# builtin default.
#
# Auditing is OPTIONAL (ADR-0028): unless a profile binds `audit.sink` to this
# operator, every seam is a no-op. local-dev leaves it unbound.

[pack]
name        = "obs-operator-audit-store"
version     = "0.1.1"
type        = "operator"
description = "Zero-dep hash-chained append-only audit log — provides the audit.sink capability."
kind        = "service_provider"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"

# Append-only JSONL with a sha256 hash-chain. Reuses the events.jsonl file
# convention; no new store. Dispatches in-process; also usable as a template
# `operation` node to write an audit row explicitly.
[operator."audit/store"]
version       = "0.1.1"
implements    = ["contract://audit.sink/1.0.0"]
input_schema  = "AuditWriteInput"
output_schema = "AuditWriteOutput"
long_running  = false
requires_gpu  = false
supports_mock = true
risk          = "read_only"
executors     = ["in_process"]

[operator."audit/store".capabilities]
provides = ["audit.sink"]
