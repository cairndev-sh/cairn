# FOLDED INTO cairndev (ADR-0137 D2): this pack is not a distribution of its own. The engine
# wheel (the repository root's pyproject.toml) carries its import root and pack.toml, and the
# root carries the copy of its entry points and extras (flattened onto `cairndev[<extra>]`).
# This file keeps the pack's own declaration; tests/core/test_folded_engine_wheel.py holds the
# root equal to it. It has no build-system table: nothing builds or installs it.
[project]
name = "cairn-operator-audit-store"
version = "0.1.1"
description = "Zero-dep hash-chained append-only audit sink operator pack (backs audit.sink)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

# Zero dependencies by design — stdlib hashlib/json only. The builtin default
# carries no heavy/vendor SDK (ADR-0027 builtins rule); OTel/immudb/SIEM sinks
# ship as separate official operators.
dependencies = []

[project.entry-points."cairn.operators"]
"audit/store" = "operator_audit_store.operators.audit_store:AuditStoreOp"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_audit_store"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_audit_store/pack.toml"
