# FOLDED INTO cairndev (ADR-0137 D2): this pack is not a distribution of its own. The engine
# wheel (the repository root's pyproject.toml) carries its import root and pack.toml, and the
# root carries the copy of its entry points and extras (flattened onto `cairndev[<extra>]`).
# This file keeps the pack's own declaration; tests/core/test_folded_engine_wheel.py holds the
# root equal to it. It has no build-system table: nothing builds or installs it.
[project]
name = "cairn-operator-rag-rerank"
version = "0.1.0"
description = "Cross-corpus re-ranking for RAG hits — identity (score) default | cross_encoder | cohere (#513)."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.11"

# Identity (score passthrough) is the deterministic, dependency-free default —
# always available, what tests run against. The real rerankers are heavy extras.
dependencies = []

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

[project.optional-dependencies]
# Cross-encoder relevance scoring (query, passage) — local torch model.
cross_encoder = ["sentence-transformers>=3.0"]
# Cohere Rerank API — network, needs COHERE_API_KEY.
cohere = ["cohere>=5.0"]

[project.entry-points."cairn.operators"]
"rag/rerank" = "operator_rag_rerank.operators.rerank:RerankOp"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_rag_rerank"]
exclude = ["CLAUDE.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_rag_rerank/pack.toml"

# Process files (agent instructions) and tests stay out of the source archive.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/tests"]
