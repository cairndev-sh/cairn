# FOLDED INTO cairndev (ADR-0137 D2): this pack is not a distribution of its own. The engine
# wheel (the repository root's pyproject.toml) carries its import root and pack.toml, and the
# root carries the copy of its entry points and extras (flattened onto `cairndev[<extra>]`).
# This file keeps the pack's own declaration; tests/core/test_folded_engine_wheel.py holds the
# root equal to it. It has no build-system table: nothing builds or installs it.
[project]
name = "cairn-operator-remote"
version = "0.1.0"
description = "Run a command/job on any SSH box you own — generic remote compute (remote.exec) — and start and stop the box (compute.acquire, compute.release)."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.11"
# stdlib only on the base path; SSH is the [ssh] extra (lazy-imported). compute/acquire and
# compute/release call EC2 through cairn.core.compute_lifecycle, whose boto3 is a base
# dependency of the engine wheel, so they add nothing to an install.
dependencies = []

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

[project.optional-dependencies]
ssh = ["asyncssh>=2.14"]

[project.entry-points."cairn.operators"]
"remote/exec" = "operator_remote.operators.exec:RemoteExecOp"
"compute/acquire" = "operator_remote.operators.acquire:ComputeAcquireOp"
"compute/release" = "operator_remote.operators.release:ComputeReleaseOp"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_remote"]
exclude = ["CLAUDE.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_remote/pack.toml"

# Process files (agent instructions) and tests stay out of the source archive.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/tests"]
