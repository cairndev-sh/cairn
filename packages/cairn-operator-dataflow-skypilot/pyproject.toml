[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn-operator-dataflow-skypilot"
version = "0.3.3"
description = "The SkyPilot provisioning dataflow engine (ADR-0104 D5) for cairn's ml and data flows — offered by cairndev[skypilot] (ADR-0134 D3)."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.12"
# No hard dependency on SkyPilot: the engine imports `sky` lazily, so this wheel imports and
# registers without it (its tests drive a fake). `cairndev[skypilot]` installs both; installing
# this wheel alone, add the extra below.
dependencies = []

[project.optional-dependencies]
# The PROVISIONING engine (ADR-0104 D5, #2073): the clouds cairn's compute connections
# already name are the extras picked. A control plane that never acquires a machine must not
# carry this cloud SDK stack, which is why it is optional.
skypilot = ["skypilot[aws,kubernetes,runpod,ssh,vast]>=0.13"]

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

# #1512 — core selects an engine by NAME through this group and never imports this pack.
[project.entry-points."cairn.dataflow_engines"]
"skypilot" = "operator_dataflow_skypilot.factory:skypilot_engine"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_dataflow_skypilot"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_dataflow_skypilot/pack.toml"
