# FOLDED INTO cairndev (ADR-0137 D2/D3): this contract package is not a distribution of its own.
# The engine wheel (the repository root's pyproject.toml) hosts its definitions at
# `cairn_contracts/<name>/`, with the descriptor's own version. It has no build-system table:
# nothing builds or installs it.
# A shared contract distribution (#2243 V2, ADR-0111), built like cairn-contracts-eval: DATA
# ONLY — no Python package, no entry points.
[project]
name = "cairn-contracts-rag"
version = "1.0.0"
description = "Shared contract definitions for the RAG capability domain (rag.search, rag.fetch, rag.rerank)."
requires-python = ">=3.12"
dependencies = []
license = { text = "Apache-2.0" }

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"definitions" = "cairn_contracts/cairn-contracts-rag"
