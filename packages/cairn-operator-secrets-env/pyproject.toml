# FOLDED INTO cairndev (ADR-0137 D2): this pack is not a distribution of its own. The engine
# wheel (the repository root's pyproject.toml) carries its import root and pack.toml, and the
# root carries the copy of its entry points and extras (flattened onto `cairndev[<extra>]`).
# This file keeps the pack's own declaration; tests/core/test_folded_engine_wheel.py holds the
# root equal to it. It has no build-system table: nothing builds or installs it.
[project]
name = "cairn-operator-secrets-env"
version = "0.1.0"
description = "Env-var SecretStore (secrets.store) for cairn — zero-dep default."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
requires-python = ">=3.12"
dependencies = []  # stdlib os.environ only

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

[project.entry-points."cairn.operators"]
"secrets/env" = "operator_secrets_env.operators.env:EnvSecretStoreOp"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_secrets_env"]
exclude = ["CLAUDE.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_secrets_env/pack.toml"

# Process files (agent instructions) and tests stay out of the source archive.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/tests"]
