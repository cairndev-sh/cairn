# FOLDED INTO cairndev (ADR-0137 D2): this pack is not a distribution of its own. The engine
# wheel (the repository root's pyproject.toml) carries its import root and pack.toml, and the
# root carries the copy of its entry points and extras (flattened onto `cairndev[<extra>]`).
# This file keeps the pack's own declaration; tests/core/test_folded_engine_wheel.py holds the
# root equal to it. It has no build-system table: nothing builds or installs it.
[project]
name = "cairn-operator-dataflow"
version = "0.1.0"
description = "The dataflow boundary (ADR-0081): dataflow/run operator + the builtin engine (cairn-dataflow-run)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Base install = the OPERATOR only (control plane) — no data deps (ADR-0081 D5).
dependencies = []

[project.optional-dependencies]
# [engine] = what a JOB MACHINE installs. The P1a runner itself is stdlib-only;
# these arrive for the real stages (P1b: polars shards, duckdb global state).
engine = ["polars>=1.0", "duckdb>=1.0", "pyarrow>=15"]
# [ssh] = the rung-1 dispatch path: the builtin engine launches cairn-dataflow-run
# on a box via the PROVEN cairn-operator-remote machinery (never re-implemented here).
ssh = ["cairn-operator-remote[ssh]"]
# The Metaflow engine is its own optional wheel, cairn-operator-dataflow-metaflow, offered by
# cairndev[metaflow] (ADR-0134 D2, #2678).
# The SkyPilot engine is its own optional wheel too, cairn-operator-dataflow-skypilot, offered by
# cairndev[skypilot] (ADR-0134 D3a).

[project.entry-points."cairn.operators"]
"dataflow/run" = "operator_dataflow.operators.run:DataflowRunOp"
"ml/run" = "operator_dataflow.operators.run_ml:MlRunOp"
"artifact/promote" = "operator_dataflow.operators.promote:ArtifactPromoteOp"

# #1512 — core selects an engine by NAME through this group and never imports
# this pack; each factory takes (*, kind, target) and reads its own config.
[project.entry-points."cairn.dataflow_engines"]
"builtin" = "operator_dataflow.engines:builtin_engine"

[project.entry-points."cairn.dataflow_stages"]
"noop" = "operator_dataflow.stages:noop"
"noop.slow" = "operator_dataflow.stages:noop_slow"

[project.scripts]
cairn-dataflow-run = "operator_dataflow.engine.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_dataflow"]

[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_dataflow/pack.toml"
