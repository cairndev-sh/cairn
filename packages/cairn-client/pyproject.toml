# cairn-client — the typed Python API client (#1194, ADR-0085 D7).
#
# THE dependency boundary for everything that consumes the control plane from
# outside the engine process: ported CLI user commands (#1195), the ask agent
# (#1196), scripts, notebooks. Depends on httpx and NOTHING from cairn.core —
# a CI test enforces that (the import-linter rule the ADR requires).
[project]
name = "cairn-client"
version = "0.1.1"
description = "Typed Python client for the cairn control-plane API"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "cairn maintainers"}]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_client"]
exclude = ["CLAUDE.md", "AGENTS.md"]

# Process files (agent instructions) and tests stay out of the source archive.
[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/tests"]
