# FOLDED INTO cairndev (ADR-0137 D2): this pack is not a distribution of its own. The engine
# wheel (the repository root's pyproject.toml) carries its import root and pack.toml, and the
# root carries the copy of its entry points and extras (flattened onto `cairndev[<extra>]`).
# This file keeps the pack's own declaration; tests/core/test_folded_engine_wheel.py holds the
# root equal to it. It has no build-system table: nothing builds or installs it.
[project]
name = "cairn-operator-mcp"
version = "0.1.0"
description = "Universal MCP dispatcher — calls any tool on any configured MCP server."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

# cairn itself ships the langchain-mcp-adapters dep that the
# substrate's services/mcp/client.py imports lazily; this operator just
# wraps that client surface — nothing extra to pin.
dependencies = []

[project.entry-points."cairn.operators"]
"mcp/call" = "operator_mcp.operators.call:CallOp"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_mcp"]

# pack.toml lives at the package root for `agentops pack info` / loader
# discovery; the wheel includes it alongside the Python module.
[tool.hatch.build.targets.wheel.force-include]
"pack.toml" = "operator_mcp/pack.toml"
