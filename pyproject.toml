[project]
# The DISTRIBUTION is `cairndev` (ADR-0121 D3, #2429); the import name `cairn` and the
# `cairn` command do not change.
name = "cairndev"
version = "0.1.3"
description = "A governed control plane for AI and ML work: pipelines that fine-tune, evaluate, compress and serve models, with approval, policy, budget and lineage on every step"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "cairn maintainers"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # #1195 (ADR-0085 D7) — `cairn remote` (and each further ported user
    # command) drives the control plane through the typed client. The client
    # depends on NOTHING from cairn; this direction (cairn → cairn-client)
    # is the allowed one.
    "cairn-client",
    # the authoring projection (#1253, ADR-0087 P1) — compiles classes to
    # records; imports NOTHING from cairn.core (the golden tests in tests/core
    # hold compiler and loader together).
    "fastapi[standard]>=0.115.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.2.0",
    "litellm>=1.50.0",
    "fastmcp>=2.0.0",
    "jinja2>=3.1.0",
    # #1545 — [compat] cairn_engine enforcement parses SpecifierSets at pack
    # load; declared explicitly so the loader never leans on a transitive dep.
    "packaging>=23.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    # The ONE expression language (#1118). cairn.core.engine.expr imports it at
    # module load, and every `cairn` command reaches that through cairn.core.dataflow,
    # so it is a base dep, not only [kernel] (#2536: a plain install got it only
    # transitively, through boto3).
    "jmespath>=1.0",
    "jsonschema>=4.26.0",  # shared contract schema validation (#2240)
    "referencing>=0.37.0",  # exact contract:// reference closure (#2240 B2)
    # Comment-preserving TOML editing — the profile form reads + writes
    # cairn/profiles/*.toml without dropping their explanatory comments
    # (stdlib tomllib is read-only). Used by the web profile editor.
    "tomlkit>=0.13.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    # Skill files are YAML-frontmatter markdown (skill_engine.load_skill).
    "python-frontmatter>=1.0.0",
    # In-process schedulers: SkillScheduler + RagIndexScheduler (Tier 1).
    "apscheduler>=3.10.0",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-instrumentation-logging",
    # JWT auth for the trigger server control plane (an internal issue).
    # Token *verification* is the hot path; password *hashing* for POST /token is pwdlib, below.
    "pyjwt>=2.8.0",
    # CLI dispatcher — backs the `cairn` script entry point. Light enough
    # to be a base dep so `pip install cairn` gives users the CLI.
    "typer>=0.12.0",
    # ADR-0137 D2 — the builtin operator packs (packages/cairn-operator-<name>) and the core
    # contracts (packages/cairn-contracts-<name>) ship INSIDE this wheel: their import roots,
    # pack.toml manifests and contract definitions are in [tool.hatch.build] below, and their
    # entry points are this project's own. None of them is a distribution of its own, so none
    # is a dependency. The official packs, the domain contracts, `cairn-ask` and asyncssh are
    # extras or the platform's.
    # `cairn dev` turns on password sign-in (dev/dev) and the quickstart logs in with it, so password
    # hashing is part of the base install (0.1.2; in 0.1.1 it was only the `auth` extra).
    "pwdlib[argon2]>=0.2.0",
]

[project.urls]
Homepage = "https://cairndev.sh"
Documentation = "https://docs.cairndev.sh"
Source = "https://github.com/cairndev-sh/cairn"
Issues = "https://github.com/cairndev-sh/cairn/issues"

# `cairn` script — landed on PATH by `pip install -e .`. Sub-commands
# live under cairn/cli/commands/, registered in cairn/cli/main.py.
[project.scripts]
cairn = "cairn.cli.main:app"
# The trigger server, runnable from an installed wheel (ADR-0029). A second
# console script, NOT an 11th CLI verb — the verb list is locked (§24.20.14).
cairn-server = "cairn.core.triggers.main:main"
# The Temporal worker (an internal issue): the durable executor that picks
# up workflows the server submits when CAIRN_RUNTIME=temporal. Needs the
# runtime-temporal extra; runs as the `worker` service in the full local stack.
cairn-worker = "cairn.core.runtime.temporal.worker:main"
# Read-only admin UI over the run store. Serves /admin via starlette-admin bound to
# the configured RunStore (sqlite or Postgres). starlette-admin and itsdangerous are
# not an extra: the command says how to add them to its environment.
cairn-admin = "cairn.core.admin:main"
# ADR-0137 D2 — the builtin dataflow engine's job-machine entrypoint (packages/cairn-operator-dataflow).
cairn-dataflow-run = "operator_dataflow.engine.entry:main"

# Vector-store PROVIDERS (#76) — external backends kept OUT of the core import
# path, resolved lazily via this entry-point group (core `services/rag/stores`
# ships only sqlite_vec + pgvector). Code in cairn/providers/vectorstores/;
# third-party deps behind the rag-qdrant / rag-pinecone extras.
[project.entry-points."cairn.vector_stores"]
qdrant = "cairn.providers.vectorstores.qdrant:QdrantStore"
pinecone = "cairn.providers.vectorstores.pinecone:PineconeStore"

# Demo-data providers for `cairn demo` / `cairn dev --seed` (ADR-0120 D4, #2418;
# loader: cairn/core/pack/seeds.py). The core's own seeds the example pack;
# platform-demo (the flagship flows + governed scenarios) is declared by
# the platform package (#2421). The licence door's `cairn.model_catalogs`
# (#2414) has no core provider: the platform declares the training catalogue;
# absent = no catalogue.
[project.entry-points."cairn.seeds"]
hello-cairn = "cairn.core.demo_seed:seed_hello_cairn"

# ── ADR-0137 D2 — the builtin operator packs' entry points ───────────────────────
# Each builtin pack (packages/cairn-operator-<name>) declares these in its own pyproject.toml,
# which is no longer built (no [build-system]); this wheel carries the pack, so it carries the
# copy. tests/core/test_folded_engine_wheel.py holds the two equal.
[project.entry-points."cairn.operators"]
"artifact/promote" = "operator_dataflow.operators.promote:ArtifactPromoteOp"
"audit/store" = "operator_audit_store.operators.audit_store:AuditStoreOp"
"data/profile" = "operator_data_profile.operators.profile:DataProfileOp"
"dataflow/run" = "operator_dataflow.operators.run:DataflowRunOp"
"mcp/call" = "operator_mcp.operators.call:CallOp"
"memory/search" = "operator_memory_local.operators.search:SearchOp"
"memory/write" = "operator_memory_local.operators.write:WriteOp"
"ml/run" = "operator_dataflow.operators.run_ml:MlRunOp"
"monitor/dispatch" = "operator_monitor_threshold.operators.dispatch:DispatchOp"
"monitor/propose" = "operator_monitor_threshold.operators.propose:ProposeOp"
"monitor/threshold" = "operator_monitor_threshold.operators.threshold:ThresholdOp"
"rag/fetch" = "operator_rag_local.operators.fetch:FetchOp"
"rag/rerank" = "operator_rag_rerank.operators.rerank:RerankOp"
"rag/search" = "operator_rag_local.operators.search:SearchOp"
"redact/text" = "operator_redact_regex.operators.redact_text:RedactTextOp"
"remote/exec" = "operator_remote.operators.exec:RemoteExecOp"
"secrets/env" = "operator_secrets_env.operators.env:EnvSecretStoreOp"
"secrets/infisical" = "operator_secrets_infisical.operators.infisical:InfisicalSecretStoreOp"
"storage/get" = "operator_artifact_local.operators.get:GetOp"
"storage/put" = "operator_artifact_local.operators.put:PutOp"
"train/eval-loss" = "operator_train_local.operators.eval_loss:EvalLossOp"
"train/lora" = "operator_train_local.operators.lora:TrainLoraOp"

# #1512 — core selects an engine by NAME through this group and never imports the pack.
[project.entry-points."cairn.dataflow_engines"]
"builtin" = "operator_dataflow.engines:builtin_engine"

[project.entry-points."cairn.dataflow_stages"]
"noop" = "operator_dataflow.stages:noop"
"noop.slow" = "operator_dataflow.stages:noop_slow"
"train.lora" = "operator_train_local.stages:train_lora"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "langgraph-cli[inmem]>=0.1.50",
    "deepeval>=1.5.0",
    "moto>=5.0",          # mock AWS for cairn-operator-s3 tests (hermetic)
    # Detect sync I/O blocking the asyncio event loop in async tests (issue #84).
    # Used by the opt-in `no_loop_blocking` fixture. Same tool Langflow runs in CI.
    "blockbuster>=1.5.20,<1.6",
]
telemetry = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]
# Read-only web admin over the run store (cairn-admin / mount_admin). Custom
# data layer over RunStore — no ORM — so it follows CAIRN_STORAGE (sqlite/pg).
# Optional chat UI shell over POST /ask — not part of the demo stack;
# install ad-hoc if you want it: `pip install -e ".[chat]"`.
rag = [
    "fastembed>=0.3.0",
    # fastembed pulls onnxruntime; releases after 1.20.1 ship no wheels for
    # macOS-x86_64, so a fresh sync on Intel Macs fails without this pin.
    'onnxruntime<=1.20.1 ; platform_system == "Darwin" and platform_machine == "x86_64"',
    "google-genai>=1.0.0",
    "llama-index-core>=0.12.0",
    "llama-cloud>=0.1.0",
    "trafilatura>=2.0.0",
]
# Production PII scrub for dataset/anonymize + dataset/pii_scan (#711): Microsoft
# Presidio (NER-based) catches human PII the zero-dep regex fallback can't — phone,
# credit-card, person, location. Mirrors the dataset-checks operator's own [pii] extra.
# The spaCy model (en_core_web_lg) is NOT a PyPI dep — the image installs it
# explicitly (Dockerfile.engine) via the pinned model wheel; locally:
#   uv pip install "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl"
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
rag-qdrant = ["qdrant-client>=1.9.0"]
rag-pinecone = ["pinecone-client>=3.0.0"]
rag-pgvector = ["asyncpg>=0.29.0", "pgvector>=0.3.0"]
# Zero-config dev: vectors in the same SQLite file as runs/events via the
# sqlite-vec extension. Delivers the §24.4 Tier-1 "one file" promise.
rag-sqlite-vec = ["sqlite-vec>=0.1.0"]
# §24.4 P5: Postgres-backed RunStore for runs + events. Install + set
# CAIRN_STORAGE=postgres://… to route the run store to Postgres. Pair with
# rag-pgvector for the full "one Postgres for everything" prod tier.
storage-postgres = ["asyncpg>=0.29.0"]
# Durable HITL (ADR-0024 RM3): LangGraph checkpointer backends for the
# action saga's interrupt()/resume. Default tier is in-process MemorySaver
# (no extra). Install one of these + set CAIRN_CHECKPOINTER=sqlite|postgres
# for cross-restart durability.
runtime-postgres = ["langgraph-checkpoint-postgres>=3.0.0"]
runtime-sqlite = ["langgraph-checkpoint-sqlite>=2.0.0"]
# Temporal runtime (ADR-0022 Step 3): CAIRN_RUNTIME=temporal submits runs as
# Temporal workflows via the langgraph plugin. Optional — inprocess default.
runtime-temporal = ["temporalio[langgraph]>=1.28.0"]
# DBOS durable runtime (ADR-0035): CAIRN_RUNTIME=dbos wraps each run as a DBOS
# workflow for crash-recovery + durable HITL — a library, no server, backed by
# SQLite (dev) or the one Postgres (prod). Pair with runtime-sqlite /
# runtime-postgres for the LangGraph checkpointer that owns the actual resume.
runtime-dbos = ["dbos>=2.0"]
# Hyperparameter search (#2034, ADR-0102 D2 · warm-start §3.6.3 "wire, never
# build"). Optuna is the SEARCH layer only: `enqueue_trial` injects the
# portfolio, its pruner does successive halving, and its RDB storage is the
# trial database. cairn keeps the governance shell around it. Nothing in the
# core imports optuna — `cairn.core.storage.training_runs.optuna_storage_url`
# derives the storage URL (the same database the training_runs rows live in)
# without it, so this extra is needed only to CREATE a study.
optuna = ["optuna>=4.0"]
# Kept for compatibility: since 0.1.2 password hashing (pwdlib[argon2]) is a base dependency,
# so `cairndev[auth]` installs nothing more. Enable auth with CAIRN_JWT_SECRET + CAIRN_API_PASSWORD[_HASH].
auth = ["pwdlib[argon2]>=0.2.0"]
# NATS JetStream backend for the durable trigger inbox (#115) — the multi-node
# swap behind the TriggerInbox Protocol. Optional: the sqlite inbox is the
# default and needs no broker. Install with `pip install -e ".[nats]"`.
nats = ["nats-py>=2.6.0"]
# Built-in in-process OAuth broker (#116) — AuthlibBroker runs the auth-code
# dance in cairn's own process (no sidecar), full token custody. Optional:
# The built-in (and only shipped) broker — #310. Install with `pip install -e ".[oauth]"`.
oauth = ["authlib>=1.3.0"]
# Infisical writable secret backend (#200) — store credential values in a
# self-hosted/cloud Infisical (MIT core) via infisical:// refs. Optional: the
# local encrypted-file backend (cryptography, base dep) is the default and needs
# no service. Install with `pip install -e ".[infisical]"`. The same SDK backs the
# builtin secrets/infisical operator (its pack's [infisical] extra, ADR-0137; lazy import).
infisical = ["infisicalsdk>=1.0.0"]
# The example pack and everything its four pipelines reach beyond the base install
# (ADR-0127 D1): `pip install 'cairndev[hello]'` → cairn-pack-hello[all] → the
# sqlite-vec store, asyncssh and DBOS. The training stack is not in it
# (cairndev[train]).
hello = ["cairn-pack-hello[all]"]
# #898 (epic #888) — the whole real fine-tuning stack in ONE install, so a
# governed prod deployment doesn't have to hunt down 5 extras: presidio PII
# (NER, not regex), the lm-eval benchmark harness, the MLflow registry, the
# durable Temporal runtime, and the Postgres run store + near-dup MinHash.
# Pair with a profile that declares the governed gates (the platform's
# production.toml, ADR-0134 D5): `cairn doctor` cross-checks it against these,
# failing if any is missing (#898). Real GPU training runs on a box that
# additionally installs the training operator's `[local]` (or `[gpu]`) extra.
# The flow engines + columnar kernels an environment can SELECT (dataflow_engine /
# ml_engine = builtin|metaflow; dedup backend=duckdb). Baked into the
# prod image (Dockerfile.engine) so a selected engine is always runnable — a
# control plane whose doctor says "ml_engine=metaflow" must be able to import
# metaflow. Found live 2026-08-18 that it could not.
# ── [kernel] — what a JOB MACHINE needs, as opposed to a control plane (#2093) ──
# A box or container that RUNS a flow imports `cairn.core.dataflow` (the spec +
# the defs), the expression language, and the schema loader — and nothing else
# of cairn's. It must NOT carry fastapi/langgraph/litellm/temporalio: those are
# the control plane, and shipping them to a rented GPU is the boundary
# `deploy/images/train-gpu/Dockerfile` exists to hold.
#
# This set is MEASURED, not guessed. Before it existed, the image installed
# `cairn --no-deps` and hand-picked the rest, so a missing dependency was
# discovered by a training run failing on billed hardware: `boto3` on
# 2026-09-07 (every flow stage silently unimportable, reported as "unknown
# stages"), then `jsonschema` mid-run. To re-measure after changing the kernel
# path:
#
#   python -c "import sys; b=set(sys.modules); import cairn.core.dataflow; #              print(sorted({m.split('.')[0] for m in set(sys.modules)-b}))"
#
# and run one real ML flow — import-time measurement alone does NOT catch a
# lazy import on the run path, which is exactly how `jsonschema` was missed.
kernel = [
    "pydantic>=2.7",       # the DataflowSpec / FlowDef contracts
    "pyyaml>=6.0",         # flows/*.yaml
    "jmespath>=1.0",       # the ONE expression language (#1118)
    "jsonschema>=4.26.0",  # yaml_loader at import; the ONE contract validator (ADR-0118 D5) — the core floor
    "boto3>=1.34.0",       # stage inputs/outputs through the S3 artifact store (#1442)
    # cairn.core.provider_settings, reached from cairn.core.obs.cost when a
    # stage BODY runs. Not on the import path of `cairn.core.dataflow`, so the
    # sys.modules measurement above cannot see it — found by running the real
    # fine-tune flow in the image on 2026-09-08, which is why that measurement
    # note says import-time alone is not enough.
    "pydantic-settings>=2.6.0",
]


# ── ADR-0120 D3 (#2419) — what is NOT the public set ─────────────────────────
# `cairn ask` (the NL→plan agent toolchain, #1196). The platform's `cairn.cli` provider
# mounts the command only when cairn_ask is importable (ADR-0134 D6).
# asyncssh (EPL-2.0 OR GPL-2.0-or-later) — kept out of the base install. remote/exec
# (the train/remote path, which the builtin dataflow SSH engine reaches lazily) fails at
# runtime "needs asyncssh" without it (#536 e2e); serve/vllm's own [ssh] is in [platform].
# The remote pack's [ssh] and the dataflow pack's [ssh] (which named the remote pack's), flattened
# (ADR-0137 D5).
ssh = ["asyncssh>=2.14"]
# ADR-0127 D4 — the CPU LoRA stack train/lora and the `train.lora` stage need (torch,
# transformers, peft, datasets). Separate from every other extra on purpose: CPU torch is
# too large for the engine image, so Dockerfile.engine does not install it.
# The train-local pack's [train], flattened (ADR-0137 D5).
train = ["torch>=2.11,<2.12", "transformers>=5.5,<5.6", "peft>=0.20,<0.21", "datasets>=4.3,<4.4"]
# ADR-0137 D5 — the builtin packs' own extras, flattened onto the engine: this wheel carries the
# builtins (ADR-0137 D2), so a hint or a deployment names `cairndev[<extra>]`. The packs'
# pyproject.toml files keep their own tables; tests/core/test_folded_engine_wheel.py holds the
# two equal through one map (pack, pack extra) → root extra.
# The builtin dataflow engine's job-machine libraries (polars shards, duckdb, pyarrow).
dataflow-engine = ["polars>=1.0", "duckdb>=1.0", "pyarrow>=15"]
# rag/rerank's cross-encoder (local torch model) and Cohere (network, COHERE_API_KEY) scorers.
rerank-cross-encoder = ["sentence-transformers>=3.0"]
rerank-cohere = ["cohere>=5.0"]
# ADR-0134 D2 (#2678) — the Metaflow dataflow engine: an optional public wheel, never a base
# dependency. `[profile.backends] ml_engine = "metaflow"` without it is refused at the launch door.
metaflow = ["cairn-operator-dataflow-metaflow", "metaflow>=2.12"]
# ADR-0134 D3a — the SkyPilot provisioning engine: an optional public wheel. Selecting it without
# the wheel is refused at the launch door (ADR-0134 D3c).
skypilot = ["cairn-operator-dataflow-skypilot", "skypilot[aws,kubernetes,runpod,ssh,vast]>=0.13"]
# The platform: every official operator pack and the domain contracts. Today's
# deployments, this repository's CI and the engine image install
# `cairn[platform,ssh,ask]`.


# Pack discovery: cairn.core walks the `cairn.packs` / `cairn.operators` entry-point
# groups at startup. Every entry point is declared by the distribution that ships
# it: the builtin operator packs by this project (ADR-0137 D2, above), the optional
# operator packs by their own wheels, and domain packs as DATA wheels
# `cairn-pack-<name>` (#2420, ADR-0121) whose own `pyproject.toml` declares the
# pack's own entry point. The root declares no domain pack, so a domain pack is
# invisible until its wheel is installed.

# ADR-0120 D4 (#2422) — HTTP surfaces beyond the public API (D2) are `cairn.routers`
# providers. The root registers none: the server mounts D2 itself (`jobs` and the
# `/oauth/callback` redirect included, #2427), and the console's surfaces, `ask` and the
# product routers are declared by the platform package, which ships them (#2421, #2427).

# ─── uv workspace ───────────────────────────────────────────────────
#
# The members are the distributions this tree builds BESIDE the engine: the typed client, the
# optional operator packs (ADR-0134 D1) and the example pack. The builtin operator packs and the
# core contracts are not members: their directories under packages/ keep their sources, tests and
# pyproject.toml (no [build-system]), and THIS project's wheel carries them (ADR-0137 D2).
[tool.uv.workspace]
members = [
    "packages/cairn-client",
    "packages/cairn-operator-dataflow-metaflow",
    "packages/cairn-operator-dataflow-skypilot",
    "examples/hello-cairn",
]

[tool.uv.sources]
cairn-client           = { workspace = true }
cairn-pack-hello = { workspace = true, editable = false }
cairn-operator-dataflow-metaflow = { workspace = true }
cairn-operator-dataflow-skypilot = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADR-0137 D2 — the engine (`cairn`) and every builtin operator pack's import root, each placed
# at the top of the wheel exactly as its own wheel placed it.
packages = [
    "src/cairn",
    "packages/cairn-operator-artifact-local/src/operator_artifact_local",
    "packages/cairn-operator-audit-store/src/operator_audit_store",
    "packages/cairn-operator-data-profile/src/operator_data_profile",
    "packages/cairn-operator-dataflow/src/operator_dataflow",
    "packages/cairn-operator-mcp/src/operator_mcp",
    "packages/cairn-operator-memory-local/src/operator_memory_local",
    "packages/cairn-operator-monitor-threshold/src/operator_monitor_threshold",
    "packages/cairn-operator-rag-local/src/operator_rag_local",
    "packages/cairn-operator-rag-rerank/src/operator_rag_rerank",
    "packages/cairn-operator-redact-regex/src/operator_redact_regex",
    "packages/cairn-operator-remote/src/operator_remote",
    "packages/cairn-operator-secrets-env/src/operator_secrets_env",
    "packages/cairn-operator-secrets-infisical/src/operator_secrets_infisical",
    "packages/cairn-operator-train-local/src/operator_train_local",
]
exclude = ["CLAUDE.md", "AGENTS.md"]

# Each builtin pack's manifest at `operator_<pack>/pack.toml`, and each core contract package
# hosted at `cairn_contracts/cairn-contracts-<domain>/` — the paths their own wheels installed,
# so the contract package identities (names, descriptor versions, digests) do not change
# (ADR-0137 D3). An editable install copies the contract definitions (it reads the packs'
# code and pack.toml from packages/): after editing a contract, `uv sync --reinstall-package
# cairndev`.
[tool.hatch.build.targets.wheel.force-include]
"packages/cairn-operator-artifact-local/pack.toml" = "operator_artifact_local/pack.toml"
"packages/cairn-operator-audit-store/pack.toml" = "operator_audit_store/pack.toml"
"packages/cairn-operator-data-profile/pack.toml" = "operator_data_profile/pack.toml"
"packages/cairn-operator-dataflow/pack.toml" = "operator_dataflow/pack.toml"
"packages/cairn-operator-mcp/pack.toml" = "operator_mcp/pack.toml"
"packages/cairn-operator-memory-local/pack.toml" = "operator_memory_local/pack.toml"
"packages/cairn-operator-monitor-threshold/pack.toml" = "operator_monitor_threshold/pack.toml"
"packages/cairn-operator-rag-local/pack.toml" = "operator_rag_local/pack.toml"
