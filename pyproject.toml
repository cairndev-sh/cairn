[tool.hatch.build.targets.sdist]
# The source archive carries what builds the engine wheel (uv builds the wheel FROM it): the
# engine, the builtin packs' sources and manifests and the core contracts' definitions (plus
# README, LICENSE, NOTICE). Not process files, internal docs, tests, deploy tooling, the example
# pack, or the distributions built beside the engine, which have their own sdists (#2405).
exclude = ["CLAUDE.md", "AGENTS.md", "/.claude", "/.agents", "/.circleci", "/.github", "/docs", "/tests",
           "/deploy", "/examples", "/packages/cairn-client", "/packages/cairn-operator-dataflow-metaflow",
           "/packages/cairn-operator-dataflow-skypilot", "/packages/*/tests", "/packages/*/README.md",
           "/packages/*/DESIGN.md", "/packages/*/LICENSE", "/packages/*/NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `tests` = engine/core/CLI/pack-template/integration tests. Operator-pack tests
# live INSIDE their pack and are listed here one directory each; CI runs plain
# `pytest`, so a pack tests dir missing from this list is never run (#2410).
# Not listed: builtins/rag_parse/tests — operator-rag-parse is not a workspace
# member, so CI cannot import it (keep/retire decision: #2413).
testpaths = ["tests", "packages/cairn-operator-rag-local/tests", "packages/cairn-operator-rag-rerank/tests", "packages/cairn-operator-monitor-threshold/tests", "packages/cairn-operator-secrets-infisical/tests", "packages/cairn-operator-data-profile/tests", "packages/cairn-operator-dataflow/tests", "packages/cairn-operator-remote/tests", "packages/cairn-operator-train-local/tests", "packages/cairn-operator-dataflow-metaflow/tests", "packages/cairn-operator-dataflow-skypilot/tests"]
# Project root on sys.path so tests can resolve repo-relative paths and the
# archived legacy/ tree if a legacy test ever needs it. Active cairn.* code
# imports neither src.* nor legacy.* (the provider layer migrated into
# cairn.core / cairn.services).
pythonpath = ["."]
markers = [
    "expensive: tests that call LLMs in the synthesis path (slow, costs $)",
    "dbos: DBOS runtime integration tests (spawn subprocesses; slower) — deselect with -m 'not dbos'",
    "timing: a wall-clock benchmark measured on a developer machine; not a CI gate (run with -m timing)",
    "train: runs a real LoRA fine-tune on a tiny model; needs cairndev[train] (skips without it; the e2e train cells too)",
    # the hello-cairn feature proof (ADR-0127 D1): tests/e2e, run by scripts/oss/feature_proof.sh and the public-e2e job
    "e2e: a real cairn-server subprocess per cell, driven as a user would (tests/e2e; excluded from the unit jobs)",
    "services: an e2e cell that needs the light stack's `proof` profile (skipped with the reason when it does not answer)",
    "crash: an e2e cell that SIGKILLs the server and asserts the ADR-0125 outcome after restart",
]

[tool.ruff]
# #1515 — ruff adopted with a CORRECTNESS-ONLY ruleset, deliberately.
#
# The full default ruleset flags ~3,700 findings across 121k lines. Landing
# that as one mechanical sweep would be an unreviewable diff, and gating CI on
# it would wall off every contributor on day one — which is exactly why
# .pre-commit-config.yaml declined to wire ruff at all.
#
# So: start with the rules that find BUGS, not style. `F` + `E9` is 109
# findings, all of which this PR actually fixed — including 7 latent
# NameErrors and a 57-line dead function shadowed by a later redefinition.
# CI can gate on that from day one because it is already green.
#
# Widening the ruleset (I, UP, B, SIM…) is its own PR, one family at a time,
# each landing green. Do NOT add a family here without fixing its findings in
# the same change — a `select` that CI cannot pass is worse than no linter.
target-version = "py312"
line-length = 100
# docs/ holds prose, ADRs and illustrative design samples — the sample
# code there names things that do not exist yet ON PURPOSE.
extend-exclude = [".venv", ".claude", "console", "site", "legacy", "private", "data", "docs"]

[tool.ruff.lint]
select = ["F", "E9"]
# F401 (unused-import) is deliberately NOT adopted yet. Auto-removing "unused"
# imports broke 168 test modules on the first attempt: several modules are
# re-export points (`from .composition import load_profile_from_env`) with no
# `__all__`, so the import IS the public API and ruff cannot see that. Adopting
# it needs an `__all__` audit of the re-export modules first — its own PR.
ignore = ["F401"]
