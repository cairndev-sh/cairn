# Maintained in this repository (ADR-0132 D1: the public repository is the upstream; the assembler is retired).
# The public set and its feature proof on GitHub Actions: the `public` and `public-e2e`
# jobs, generated from the platform repository's CI (same install, markers and env).
# The public tree carries no CircleCI configuration (ADR-0132).
name: ci
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: sk-ci-dummy
      UV_PYTHON: '3.13'
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        version: 0.11.9
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Locked install of the public set only
      run: uv sync --locked --extra dev --extra rag --extra rag-sqlite-vec --extra runtime-sqlite --extra runtime-temporal
        --extra telemetry --extra auth --extra metaflow --extra skypilot
    - name: Lint (ruff, the `python` job's rule set)
      run: uvx ruff check .
    - name: Nothing private is installed
      run: .venv/bin/python scripts/check_public_set.py --extras metaflow,skypilot
    - name: The optional operator packs' own tests (ADR-0134 D1)
      run: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -m "not dbos and not timing
        and not e2e" --junitxml=/tmp/test-results/public-optional.xml packages/cairn-operator-dataflow-metaflow/tests packages/cairn-operator-dataflow-skypilot/tests
    - name: The public core's tests/core files (tests/core is exactly the public set here)
      run: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -m "not dbos and not timing
        and not e2e" --junitxml=/tmp/test-results/public.xml tests/core
    - name: The public CLI and Helm chart tests (tests/cli, tests/deploy)
      run: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -m "not dbos and not timing
        and not e2e" --junitxml=/tmp/test-results/public-cli.xml tests/cli tests/deploy
    - name: The CLI on the public core with the example pack
      run: |
        .venv/bin/cairn --help > /dev/null
        CAIRN_PACK_PATH=examples/hello-cairn .venv/bin/cairn pipeline ls | tee /tmp/pipelines.txt
        grep -q "hello-cairn" /tmp/pipelines.txt
        CAIRN_PACK_PATH=examples/hello-cairn .venv/bin/cairn pipeline explain hello-cairn/profile-and-publish > /dev/null
    - name: The built wheels (ADR-0137) — five, and cairndev carries the builtins and the core contracts
      run: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/python scripts/check_folded_wheels.py
    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-public
        path: /tmp/test-results
  public-e2e:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: sk-ci-dummy
      UV_PYTHON: '3.13'
      UV_PYTHON_PREFERENCE: only-managed
      CAIRN_E2E: '1'
      CAIRN_PROOF_PG_DSN: postgres://cairn:cairn@127.0.0.1:5432/cairn
      HELLO_TRAIN_MODEL: sshleifer/tiny-gpt2
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U cairn" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        version: 0.11.9
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Locked install of the public set with the proof extras (train when the root declares it)
      run: uv sync --locked --extra dev --extra rag --extra rag-sqlite-vec --extra storage-postgres --extra runtime-sqlite
        --extra runtime-postgres --extra runtime-dbos $(grep -q '^train = ' pyproject.toml && echo --extra train)
    - name: Every matrix and crash cell of the feature proof (tests/e2e/hello)
      run: env -u OBS_STORAGE -u CAIRN_STORAGE .venv/bin/pytest -q --no-header -p no:cacheprovider -rs -m e2e --junitxml=/tmp/test-results/public-e2e.xml
        tests/e2e
    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-public-e2e
        path: /tmp/test-results
  image:
    # The engine image is built (never pushed) on every pull request, so a Dockerfile.engine break is
    # caught before a release tag: v0.1.0's image first failed at tag time, in parallel with the PyPI
    # publish. Its own verify RUNs (operators from cairndev, contracts resolved) run inside the build.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@v3
    - name: Build the engine image (no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.engine
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
