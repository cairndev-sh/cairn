# Maintained in this repository (ADR-0132 D1: the public repository is the upstream; the assembler is retired).
# Tag-driven publishing (ADR-0121 D7). Validation runs in ci.yml (and on CircleCI); no self-hosted runner.
# Publishing is ARMED (`--publish`): a `v*` tag publishes the wheels to PyPI (the account
# token while the PYPI_API_TOKEN secret exists, then trusted publishing — #2430), the
# engine image to GHCR and the chart to GHCR's OCI registry.
name: release
'on':
  push:
    tags:
    - v*
permissions:
  contents: read
env:
  IMAGE: ghcr.io/cairndev-sh/cairn-engine
  CHART: deploy/helm/cairn
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - name: Build all workspace wheels (lockstep)
      run: uv build --all-packages
    - name: Exactly the five public wheels (ADR-0137 D6)
      run: |
        set -euo pipefail
        ls dist/*.whl | sed 's|dist/||; s|-.*||' | LC_ALL=C sort > /tmp/wheels.txt
        printf '%s\n' cairn_client cairn_operator_dataflow_metaflow cairn_operator_dataflow_skypilot cairn_pack_hello cairndev | LC_ALL=C sort > /tmp/want.txt
        diff /tmp/want.txt /tmp/wheels.txt
    - name: CycloneDX SBOMs from the tagged lock files (ADR-0121 D6, #295)
      # cairn-<v>: every workspace package with every extra, every platform, from uv.lock
      # (uv emits no licences). cairn-engine-<v>: the engine image's closure on linux/x86_64
      # with licences, read from a venv synced --frozen with the image's extras (the union of
      # Dockerfile.engine's --extra flags, so the two cannot drift). cairn-docs-site-<v>: the
      # docs site's runtime npm closure. An SBOM with no components fails the release.
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p sbom
        uv export --frozen --no-dev --all-packages --all-extras --format cyclonedx1.5 \
          --preview-features sbom-export -o "sbom/cairn-${VERSION}.cdx.json" > /dev/null
        EXTRAS=$(grep -v '^[[:space:]]*#' Dockerfile.engine | grep -o -- '--extra [a-z0-9-]*' | sort -u)
        # shellcheck disable=SC2086 # word-split on purpose: one "--extra name" pair per line
        UV_PROJECT_ENVIRONMENT=/tmp/sbom-venv uv sync --frozen --no-dev --no-editable --all-packages $EXTRAS
        uvx --from cyclonedx-bom==7.6.0 cyclonedx-py environment --spec-version 1.5 --output-format JSON \
          --pyproject pyproject.toml --mc-type application -o "sbom/cairn-engine-${VERSION}.cdx.json" /tmp/sbom-venv
        (cd docs/site && npm sbom --sbom-format cyclonedx --package-lock-only --omit dev) \
          > "sbom/cairn-docs-site-${VERSION}.cdx.json"
        for f in sbom/*.cdx.json; do
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "$f" > /dev/null
          echo "$f: $(jq '.components | length' "$f") components" | tee -a "$GITHUB_STEP_SUMMARY"
        done
    - name: GitHub Release with wheel artifacts and SBOMs
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/*
          sbom/*.cdx.json
        generate_release_notes: true
    - name: Publish to PyPI (the account token while PYPI_API_TOKEN exists, then trusted publishing)
      # Explicit files in order (ADR-0137 D6): the engine first, so it lands before any rate limit;
      # then the client, the optional engines and the example pack, which depend on it.
      # --check-url makes a rerun skip what PyPI already has.
      run: |
        set -euo pipefail
        if [ -n "$PYPI_API_TOKEN" ]; then
          export UV_PUBLISH_TOKEN="$PYPI_API_TOKEN"; AUTH=()
        else
          AUTH=(--trusted-publishing always)
        fi
        for files in 'dist/cairndev-*' 'dist/cairn_client-*' 'dist/cairn_operator_*' 'dist/cairn_pack_hello-*'; do
          uv publish ${AUTH[@]+"${AUTH[@]}"} --check-url https://pypi.org/simple/ $files
        done
      env:
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    permissions:
      contents: write
      id-token: write
    environment: pypi
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@v3
    - name: Docker metadata (tags + labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=long
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - name: Log in to GHCR (for push)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build & push the engine image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.engine
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ github.sha }}
          ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Report the pinnable reference
      run: |
        echo "### engine image" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "image.tag: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - uses: azure/setup-helm@v4
      with:
        version: v3.16.2
    - name: helm lint (default values)
      run: helm lint "$CHART"
    - name: helm lint (every example values file)
      run: |
        set -euo pipefail
        for f in "$CHART"/values-*.example.yaml; do
          echo "::group::helm lint -f $f"
          helm lint "$CHART" -f "$f"
          echo "::endgroup::"
        done
    - name: helm template (every example values file)
      run: |
        set -euo pipefail
        for f in "$CHART"/values-*.example.yaml; do
          echo "::group::helm template -f $f"
          helm template cairn "$CHART" -f "$f" > "/tmp/$(basename "$f").rendered.yaml"
          # A rendered manifest that parses is the floor, not the ceiling —
          # the Python suite below asserts what is IN it.
          python -c "import sys,yaml; list(yaml.safe_load_all(open(sys.argv[1])))" "/tmp/$(basename "$f").rendered.yaml"
          echo "::endgroup::"
        done
    - name: Log in to GHCR (for helm push)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
    - name: Package and push the chart as an OCI artifact
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME#v}"
        helm package "$CHART" --version "$VERSION" --app-version "$VERSION" -d /tmp/chart  # appVersion = the image tag the release pushes (no v)
        helm push "/tmp/chart/cairn-${VERSION}.tgz" oci://ghcr.io/cairndev-sh/charts
        echo "installed with: helm install cairn oci://ghcr.io/cairndev-sh/charts/cairn --version ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
