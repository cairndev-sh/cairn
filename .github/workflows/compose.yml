# The documented single-box install, started for real (#371). test_light_compose.py pins the file,
# and nothing else runs it, so a broken image, port or migration wouldn't fail anything. It builds the
# engine image, so it runs nightly and when something it depends on changes, not on every pull request.
# It is not one of the required checks (those are `public`, `public-e2e` and `dco`).
name: compose
'on':
  schedule:
  - cron: '17 3 * * *'
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - deploy/light/**
    - Dockerfile.engine
    - deploy/stage_venv_overlay.py
    - scripts/check_compose.py
    - .github/workflows/compose.yml
  pull_request:
    paths:
    - deploy/light/**
    - Dockerfile.engine
    - deploy/stage_venv_overlay.py
    - scripts/check_compose.py
    - .github/workflows/compose.yml
permissions:
  contents: read
concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: '3.13'
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        version: 0.11.9
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: The client the check drives the stack with
      run: uv sync --locked --extra hello
    - name: Build and start deploy/light, run a pipeline through it with and without auth, check the audit log
      run: .venv/bin/python scripts/check_compose.py
