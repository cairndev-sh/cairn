{{- if not .Values.secrets.existingSecret }}
{{/*
Chart-managed Secret. Anything you put in `secrets.existingSecret` instead is
used verbatim and this file renders nothing — the workloads reference the name
either way (cairn.secretName).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cairn.fullname" . }}-secrets
  labels:
    {{- include "cairn.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Auth is ON (issue #2): the engine refuses to start without this.
  CAIRN_JWT_SECRET: {{ .Values.secrets.obsJwtSecret | quote }}
  # argon2 — `cairn admin hash-password`. Unlike compose, YAML does not eat
  # the `$` segments, so no `$$` escaping here (#1853).
  CAIRN_API_PASSWORD_HASH: {{ .Values.secrets.obsApiPasswordHash | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  # remote/exec + durable remote-job polling (#565/#918): the SUBMIT runs in a
  # worker activity but the durable POLL runs in the SERVER lifespan, so BOTH
  # need the key.
  SSH_PRIVATE_KEY: {{ .Values.secrets.sshPrivateKey | quote }}
{{- end }}
