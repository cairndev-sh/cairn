# hello-crash — the crash cells' pack (ADR-0127 D1, hello-cairn WP7; tests/e2e/hello/test_crash.py).
#
# A domain pack owned by the harness, never shipped: check-and-publish with its flow leg
# swapped for one that takes long enough to kill the server in the middle of it
# (`noop.slow`, the builtin engine's conformance stage). The example pack stays the
# example; this one exists so a crash cell has a leg to be mid-way through.

[pack]
name        = "hello-crash"
version     = "0.1.0"
description = "The feature proof's crash cells: a slow flow leg between a data gate and a person gate."
tags = ["domain:example", "test:crash"]
kind        = "domain"
publisher   = "cairn"
trust_level = "builtin"

[compat]
cairn_engine = ">=0.1.0"
