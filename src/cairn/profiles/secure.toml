# secure — the trust+safety profile (ADR-0028).
#
# Extends local-dev and turns ON the optional safety services: PII/secret
# redaction at the LLM egress and the hash-chained audit trail. Once bound
# here, packs cannot bypass them — optional to turn ON, not optional to
# ESCAPE (ADR-0028).
#
#   CAIRN_PROFILE=cairn/profiles/secure.toml cairn-server
#
# Verify with `cairn setup --check` — the profile category checks every binding
# resolves to a registered operator.

[profile]
# #1570 — BASE layer in the chain (redaction + audit bindings)
visibility = "internal"
extends = "local-dev.toml"

[profile.bindings]
# PII + secret redaction before anything leaves to an LLM vendor
# (builtin cairn-operator-redact-regex; swap for cairn-operator-redact-presidio later).
"redact.text" = "redact/text"
# Tamper-evident hash-chained audit log: direct model completions, MCP tool
# calls through mcp/call, approvals and every governed pipeline step (builtin
# cairn-operator-audit-store; CAIRN_AUDIT_LOG sets the path). Model calls a
# template's prompt and agent nodes make through build_chat_model are not
# written yet.
"audit.sink" = "audit/store"
