# prod-infisical — production profile with Infisical-backed secrets (#408).
#
# Extends `secure` (PII/secret redaction at the LLM egress + the hash-chained
# audit trail, ADR-0028) and binds the `secrets.store` capability to the
# Infisical operator (cairn-operator-secrets-infisical, capability secrets.store).
#
# Any operation that declares a `secrets:` block then reads its keys from
# Infisical via a universal-auth machine identity — instead of the plaintext
# process environment. This is the engine half of the deploy `--profile
# infisical` service (compose stands up Infisical; THIS points the engine at
# it). Without it, the Infisical service runs but the engine never reads from
# it. `cairn admin deploy doctor` fails loud on that mismatch.
#
#   CAIRN_PROFILE=$(python -c "import cairn.profiles as p, pathlib; print(pathlib.Path(p.__file__).parent / 'prod-infisical.toml')") cairn-server
#
# Requires (for the operator, read at runtime by cairn-operator-secrets-infisical):
#   INFISICAL_CLIENT_ID · INFISICAL_CLIENT_SECRET · INFISICAL_PROJECT_ID
#   INFISICAL_ENVIRONMENT (default: dev — the operator's default; set it to your prod
#   environment slug) · INFISICAL_HOST (self-host URL)
# and `pip install 'cairndev[infisical]'` in the image.
#
# Verify with `cairn setup --check` (the profile category checks every binding
# resolves to a registered operator) and `cairn admin deploy doctor`.

[profile]
# #1570 — deployment VARIANT selected via CAIRN_PROFILE, not per run (#408)
visibility = "internal"
extends = "secure.toml"

[profile.bindings]
# Secrets come from Infisical (cairn-operator-secrets-infisical). Swap back to
# "secrets/env" (cairn-operator-secrets-env, the zero-dep plaintext-.env default)
# for a deployment that doesn't run the Infisical service.
"secrets.store" = "secrets/infisical"
