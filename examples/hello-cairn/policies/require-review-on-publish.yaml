# policies/require-review-on-publish.yaml — a pack policy (hello-cairn WP6).
#
# In the `hello-prod` environment, every `artifact/promote` waits for a person before it
# writes. The approval plane consults the environment's policies on every operator
# call (ADR-0034: operator, profile, policy and binding; strictness only), so the
# write pauses as `awaiting_approval` even where the pipeline author put no gate.
# A pipeline can add a gate; it can never remove one a policy demands.
#
# Scoped twice on purpose, because a pack policy is a proposal every environment
# adopts unless its profile lists the ones it takes (`pack_policies = [...]`):
#   * `action_types: [artifact/promote]` — the operator this governs, and only that one;
#   * `environments: [hello-prod]` — an environment NAME. A policy scoped to the
#     `production` TIER would also govern `sandbox` and every other named
#     environment (an unknown name resolves to the production tier, fail-safe), so
#     installing the example would gate every storage write in the deployment.
#
name: hello-require-review-on-publish
description: In the hello-prod environment, a tag moves only after a person approves it.

applies_to:
  action_types:
    - artifact/promote
  environments:
    - hello-prod

rules:
  - effect: require_hitl
    reason: "a tag move in hello-prod needs a person's approval (hello-cairn policy)"
    approval_role: data-owners
