# cairn-pack-hello — the example domain pack as its own distribution (#2423;
# the feature proof, ADR-0127 D1/D2).
#
# The shape #2420 gives every domain pack: a DATA wheel that declares its own
# `cairn.packs` entry point, so `pip install cairn-pack-hello` is all it takes
# for the engine to discover it (no edit to the core's pyproject). The wheel
# carries the pack directory under the import name `cairn_pack_hello`: the
# manifest, the pipelines, the flows, the corpus, the sample data, the policy, the
# profiles, the one-line shim the entry point targets, and two pieces of glue
# (ADR-0127 D2): the run-hook listener `hooks.py` and the stdio MCP server
# `tools/calc_server.py`. No operator.
#
# In a checkout you do not need the wheel: `CAIRN_PACK_PATH=examples/hello-cairn`
# loads the same directory as a dev pack (cairn/core/pack/loader.py). A dev pack
# declares no entry points, so the run-hook listener only fires once the wheel is
# installed.
[project]
name = "cairn-pack-hello"
version = "0.2.4"
description = "Example cairn domain pack: a data, an agentic, an ml and an operations pipeline, each behind gates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# The shim imports cairn.core.pack; the pipelines call builtin operators that
# ship with the engine. No other dependency on a base install.
dependencies = ["cairndev>=0.1.0"]

[project.optional-dependencies]
# Everything the four pipelines reach beyond the base install: the sqlite-vec store
# for retrieval and memory (ask-the-docs), asyncssh for remote/exec (nightly-ops),
# the DBOS durable runtime (CAIRN_RUNTIME=dbos). The MCP client and the FastMCP
# server ship with the engine's base dependencies. `cairndev[hello]` pulls this.
# tiny-finetune's training stack is separate and large: cairndev[train].
all = ["cairndev[rag-sqlite-vec,ssh,runtime-dbos]>=0.1.0"]

[project.entry-points."cairn.packs"]
hello-cairn = "cairn_pack_hello:pack"

# A receipt line per settled leg and finished run (hooks.py).
[project.entry-points."cairn.run_hooks"]
hello-receipts = "cairn_pack_hello.hooks:receipts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "cairn_pack_hello/__init__.py"
"pack.toml" = "cairn_pack_hello/pack.toml"
"hooks.py" = "cairn_pack_hello/hooks.py"
"pipelines" = "cairn_pack_hello/pipelines"
"flows" = "cairn_pack_hello/flows"
"rag" = "cairn_pack_hello/rag"
"data" = "cairn_pack_hello/data"
"policies" = "cairn_pack_hello/policies"
"profiles" = "cairn_pack_hello/profiles"
"tools" = "cairn_pack_hello/tools"

[tool.hatch.build.targets.sdist]
include = ["__init__.py", "pack.toml", "hooks.py", "pipelines", "flows", "rag", "data", "policies", "profiles",
           "tools", "README.md", "pyproject.toml"]

# In the repository's uv workspace the engine is the workspace root, not a PyPI wheel.
# (pip and an installed wheel ignore this table.)
[tool.uv.sources]
cairndev = { workspace = true }
