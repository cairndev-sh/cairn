# profiles/hello.toml — the deployment profile the hello-cairn quickstart runs under
# (hello-cairn WP6). Point the engine at it from the repository root:
#
#     export CAIRN_PROFILE=examples/hello-cairn/profiles/hello.toml
#
# Self-contained on purpose (no `extends`): a relative `extends` resolves against
# this file, and the core's profiles live at a different path in a checkout, the
# public tree and an installed wheel.

[profile]
visibility = "public"

# No `durable_runtime`: a profile pin beats CAIRN_RUNTIME (cairn/core/settings.py
# runtime()), so the runtime stays the engine's choice: in-process by default,
# CAIRN_RUNTIME=dbos for the durable one.
[profile.backends]
dataflow_engine = "builtin"      # the builtin dataflow engine (noop stages)
ml_engine       = "builtin"      # tiny-finetune's train.lora runs on this box
