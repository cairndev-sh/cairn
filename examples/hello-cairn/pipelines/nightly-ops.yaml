# pipelines/nightly-ops.yaml — the operations pipeline (hello-cairn WP6, ADR-0127 D1).
#
#   job (template: secret check → SSH report) → summarise (flow)
#     → propose ⏸ → audit
#
# A job that runs every night without a person starting it, and still asks one
# before anything follows from it:
#
#   * `job` (flows/nightly-job.md) checks the job's secret through whatever the
#     profile binds to `secrets.store` (secrets/env by default, Infisical with
#     profiles/hello-infisical.toml), then runs `command` on an SSH box through the
#     builtin remote/exec. The box is a `compute.ssh` connection (`cairn admin connect add
#     ssh`) the `compute_target` input names; a template node is where remote/exec
#     gets one (a `task:` leg has no `execution.compute_target`).
#   * `summarise` carries the report through the builtin dataflow engine.
#   * `propose` files the follow-up for a person: monitor/propose declares
#     `requires_approval`, so this leg waits on the approval queue.
#   * `audit` writes a hash-chained audit row.
#
# Every leg that settles fires the `leg.finished` run hook; this pack's
# `hello-receipts` listener (hooks.py) appends a receipt line for it.
name: nightly-ops
kind: pipeline
visibility: public
description: >
  Check a secret, run a report on an SSH box, carry it through a flow, propose
  the follow-up to a person, and audit it. Runs nightly once enabled.
outcome: Run a nightly job on a box you own
suite: operate

inputs:
  compute_target: {type: str, default: "hello-ssh", description: "The compute.ssh connection to run the report on (cairn admin connect add ssh --name hello-ssh …)."}
  secret_name: {type: str, default: "HELLO_REPORT_TOKEN", description: "The secret the job needs; checked for presence, never read into the run."}
  command:
    type: str
    default: "printf '{\"lines\": %s, \"host\": \"%s\"}' \"$(ls / | wc -l | tr -d ' ')\" \"$(hostname)\" > metrics.json && cat metrics.json"
    description: "The report command. It writes metrics.json in its working directory; remote/exec reads it back."
  max_lines: {type: int, default: 100, description: "The proposal's threshold, shown on the approval card."}

governance:
  budget: {usd: 0.1}
  series: hello
  approvers: ops

triggers:
  # The nightly run. `enabled: true` arms it when the pipeline is enabled in a
  # workspace; until then it is a declaration.
  - kind: schedule
    cron: "30 2 * * *"
    misfire: skip
    enabled: true
    description: "Every night at 02:30 (engine time)."
  # Rows past the watermark in a Postgres table start a proposal. A `table` source
  # needs a database the engine can reach: here the DSN is read from the env var
  # HELLO_EVENTS_DSN at fire time, never written in this file. Declared, NOT armed on a
  # pipeline: a `table` watch needs the platform's governed import, so core names it
  # unarmed (ADR-0131 D3) — it shows in the console as declared, not armed here.
  - kind: watch
    source: {kind: table, dsn_env: HELLO_EVENTS_DSN, table: hello_events, cursor: id}
    every: "*/10 * * * *"
    register_as: hello-events
    on_change: propose
    enabled: false
    description: "Propose a run when hello_events gains rows (needs Postgres)."

steps:
  # ── the job: secret check + SSH report (template leg) ─────────────────────
  - id: job
    label: Run the nightly report
    template: nightly-job
    with:
      compute_target: $input.compute_target
      secret_name: $input.secret_name
      command: $input.command

  # ── carry the report through a flow ───────────────────────────────────────
  - id: summarise
    label: Summarise the report
    flow: summarise
    depends_on: [job]

  # ── propose the follow-up (waits for a person) ────────────────────────────
  - id: propose
    label: Propose the follow-up
    task: monitor/propose
    depends_on: [summarise]
    with:
      metric: report lines
      value: $default($steps.job.report.lines, 0)
      threshold: $input.max_lines
      proposed_workflow: "pipeline:hello-cairn/profile-and-publish"

  # ── the audit record ──────────────────────────────────────────────────────
  - id: audit
    label: Record the nightly run
    task: audit/store
    depends_on: [propose]
    with:
      action: hello.nightly.reported
      outcome: ok
      actor: ops
      target: $steps.job.job_host

outputs:
  host: job.job_host
  report: job.report
  approved: propose.approved
  audit_hash: audit.hash
