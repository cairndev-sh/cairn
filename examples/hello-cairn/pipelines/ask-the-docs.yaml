# pipelines/ask-the-docs.yaml — the agentic pipeline (hello-cairn WP6, ADR-0127 D1).
#
#   assistant (template: search → rerank → model → MCP tool → memory)
#     → length (monitor/threshold) → review ⏸
#
# The work happens in ONE template leg, flows/assistant.md: retrieval over the
# `docs` corpus this pack ships (pack.toml [requires.rag.docs] → rag/docs/*.txt), a
# re-rank, one model call built by core's build_chat_model, a tool call on the
# example's own stdio MCP server (tools/calc_server.py, through the builtin mcp/call)
# and a memory write. Then a threshold check on how long the answer is, and a person
# reads it before anyone relies on it.
#
# What this needs from the engine (README "ask-the-docs"):
#   * a model for this governed pipeline: OPENAI_API_KEY (or LLM_GATEWAY=proxy +
#     LLM_GATEWAY_URL for any OpenAI-compatible gateway). The local `cairn run --mock`
#     dev loop has a deterministic stub; governed pipelines use the configured provider.
#   * an embedder for retrieval and memory: RAG_EMBED_PROVIDER=openai (or gemini).
#   * the corpus indexed: CAIRN_RAG_AUTOINDEX=1 on the server indexes every declared
#     corpus at boot (needs the `rag` extra). There is no indexing operator; an
#     un-indexed corpus answers with zero hits, and the model says the docs do not
#     cover the question.
#   * the MCP server named in the engine's environment, CAIRN_MCP_SERVERS (README).
#
# Starts on an event (ADR-0131 D4): when `profile-and-publish` publishes, its
# `publish` leg emits `dataset.ready`; the `kind: event` trigger below starts this
# pipeline once per message, paused until someone turns it on (README "Events").
name: ask-the-docs
kind: pipeline
visibility: public
description: >
  Answer a question from the example's own docs with retrieval, a model call and
  an MCP tool, check the answer's length, and have a person read it.
outcome: Ask a question of a small document set
suite: operate

inputs:
  question: {type: str, default: "What is the difference between a data gate and a person gate?", description: "The question to answer from rag/docs."}
  max_words: {type: int, default: 120, description: "Answers longer than this many words are flagged by the length check."}

triggers:
  - kind: event
    topic: dataset.ready
    enabled: false
    description: Ask the docs again whenever the sample dataset is published.

governance:
  # One small model call; the reservation is the ceiling, not the expected spend.
  budget: {usd: 0.5}
  series: hello
  approvers: data-owners

steps:
  # ── the agentic leg ───────────────────────────────────────────────────────
  - id: assistant
    label: Answer from the docs
    template: assistant
    with:
      question: $input.question

  # ── a threshold on the answer (read-only) ─────────────────────────────────
  # `crossed` is true when the answer runs longer than max_words. The word count
  # comes from the MCP tool the template called.
  - id: length
    label: Check the answer's length
    task: monitor/threshold
    depends_on: [assistant]
    with:
      metric: answer words
      value: $steps.assistant.answer_stats.words
      threshold: $input.max_words
      comparator: gt

  # ── the PERSON gate ───────────────────────────────────────────────────────
  - gate: review
    depends_on: [length]
    approvers: data-owners
    show:
      - assistant.answer
      - assistant.reranker
      - length.value
      - length.crossed

outputs:
  answer: assistant.answer
  words: length.value
  too_long: length.crossed
