# pipelines/tiny-finetune.yaml — the ml pipeline (hello-cairn WP6, ADR-0127 D1/D4).
#
#   train (ml flow) → loss gate → promote ⏸ → review ⏸
#
# A real LoRA fine-tune of a small causal LM (on CPU, or a CUDA GPU when available), then the governance a model
# needs before anyone uses it: the loss on rows the trainer held out (the last
# row in every eight, never trained on), a gate on that number, a governed tag, and a person.
#
#   * `train` runs flows/lora.yaml on the builtin ml engine: one `train.lora` stage
#     from the builtin train-local pack (cairn-operator-train-local, contract
#     train.finetune/1.1.0). The stage reports `kind: model`, so the leg registers
#     the adapter and exposes it as `candidate_artifact_id`. The stage splits the rows
#     itself (`split_holdout`: the last `len // 8` rows are held out, none below eight
#     rows), trains on the rest and reports `eval_loss` over the held-out rows only.
#   * `loss` compares that figure (`train.lora.eval_loss`, read as
#     `$steps.train.train_lora_eval_loss`) with `target_loss`; `loss-ok` stops the
#     pipeline when the loss is above the target. There is no separate scoring leg: the
#     train/eval-loss operator scores the first `max_samples` rows of a dataset with no
#     split, so on this data it would mostly re-score rows the adapter trained on.
#   * `promote` points the `hello-adapter@candidate` tag at the adapter;
#     artifact/promote declares `requires_approval`, so it waits for a person.
#   * `review` is the person gate that closes the run.
#
# The training stack is the `[train]` extra of cairn-operator-train-local (torch,
# transformers, peft, datasets). `device` and `precision` (both `auto`) train on a CUDA
# GPU when one is available, fp16 or bf16 by the GPU, and on the CPU in fp32 otherwise
# (ADR-0167). `base_model` defaults to the
# stand-in `sshleifer/tiny-gpt2` (seconds); `-i base_model=Qwen/Qwen2.5-0.5B` trains
# the ADR's default model in minutes.
name: tiny-finetune
kind: pipeline
visibility: public
description: >
  Fine-tune a small model with LoRA on CPU or a GPU, gate on the loss the trainer measures on
  the rows it held out, tag it, and write its card only after a person approves.
outcome: Train a small model and decide whether to keep it
suite: model

inputs:
  dataset: {type: str, default: "examples/hello-cairn/data/train.jsonl", description: "JSONL of {\"text\": ...} rows, relative to the engine's working directory."}
  base_model: {type: str, default: "sshleifer/tiny-gpt2", description: "Hugging Face model id or local directory to adapt."}
  steps: {type: int, default: 8, description: "Optimizer steps."}
  max_samples: {type: int, default: 48, description: "At most this many rows are read; the last row in every eight is held out for the loss gate and the rest train the adapter."}
  lora_rank: {type: int, default: 8, description: "LoRA rank r."}
  device: {type: str, default: "auto", description: "auto, cpu, cuda or mps. auto is CUDA when available, else the CPU."}
  precision: {type: str, default: "auto", description: "auto, fp32, fp16 or bf16. auto is fp16 or bf16 on CUDA (by GPU), fp32 elsewhere."}
  output_dir: {type: str, default: "", description: "Where to keep the adapter on the engine's box: a new directory for each run, because a later run writes over it. Empty keeps it in the engine's temp workdir, which the system can delete, so the promoted tag and the model card then name a path that may disappear."}
  target_loss: {type: float, default: 12.0, description: "The loss gate passes when the loss on the held-out rows (rows the adapter did not train on) is at or below this."}

governance:
  # A CPU fine-tune bills nothing, and every leg records cost_usd 0.0. The ceiling is
  # declared so the reservation and settlement show in the record.
  budget: {usd: 1}
  series: hello
  approvers: ml-owners

steps:
  # ── train (ml flow on the builtin ml engine) ──────────────────────────────
  - id: train
    label: Fine-tune with LoRA
    flow: lora
    timeout: 30m
    # A flow leg's stats are namespaced by stage (`train.lora.adapter_path`); the leg
    # declares its product so `$steps.train.adapter_path` is the adapter directory
    # (the stage's `output`), which the pipeline's outputs read. The stage's other stats
    # sit under `findings` as `train_lora_<name>`; `loss` reads `train_lora_eval_loss`.
    produces: {adapter_path: Model}
    with:
      dataset: $input.dataset
      base_model: $input.base_model
      steps: $input.steps
      max_samples: $input.max_samples
      lora_rank: $input.lora_rank
      device: $input.device
      precision: $input.precision
      output_dir: $input.output_dir

  # ── the loss gate ─────────────────────────────────────────────────────────
  # The data gate stops the pipeline when the trainer's own figure, over the rows it held out,
  # is above the target. With fewer than eight rows nothing is held out, the loss is empty,
  # and the gate stops rather than pass on a number that was not measured.
  - gate: loss-ok
    depends_on: [train]
    predicate: steps.train.findings.train_lora_eval_loss <= input.target_loss

  # ── tag the candidate (an operator-declared gate) ─────────────────────────
  - id: promote
    label: Tag the candidate adapter
    task: artifact/promote
    depends_on: [loss-ok]
    with:
      tag: hello-adapter@candidate
      artifact_id: $steps.train.candidate_artifact_id
      reason: "held-out loss at or below the target"

  # ── the PERSON gate ───────────────────────────────────────────────────────
  - gate: review
    depends_on: [promote]
    approvers: ml-owners
    show:
      - train.train_lora_train_loss   # the train.lora stage's train_loss (stats sit under findings)
      - train.train_lora_eval_loss   # the held-out loss the gate read
      - promote.tag
      - promote.uri

outputs:
  adapter: train.adapter_path
  eval_loss: train.train_lora_eval_loss
  promoted: promote.artifact_id
  card: card.uri
