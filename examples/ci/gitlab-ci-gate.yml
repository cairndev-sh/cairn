# cairn run --check in GitLab CI.
#
# Blocks a merge request when the training dataset fails a read-only check, and
# posts the findings as an MR note. No cairn server needed. Copy the job into your
# .gitlab-ci.yml, and copy templates/dataset-check.md to templates/ at the root of
# your repository.
dataset-gate:
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ['data/**/*']       # only when the dataset changes (tune to your repo)
  script:
    - pip install cairndev
    # Run the read-only gate; keep its exit code, always keep the report.
    - set +e
    - cairn run --check dataset-check --set path=data/train.jsonl --json > gate.json
    - rc=$?
    - cat gate.json
    # Post the cited findings as an MR note (needs a CI_JOB_TOKEN / PAT with api scope).
    - |
      if [ -n "$GITLAB_API_TOKEN" ] && [ -n "$CI_MERGE_REQUEST_IID" ]; then
        body="$(jq -c '{verdict, blocking, warnings, reasons, error}' gate.json)"
        curl -sf --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          --data-urlencode "body=### cairn run --check — \`$(jq -r .verdict gate.json)\`
      \`\`\`json
      ${body}
      \`\`\`" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" >/dev/null || true
      fi
    # Fail the job (and pipeline) if the gate failed.
    - exit $rc
  artifacts:
    when: always
    paths: [gate.json]
