# cairn run --check in GitHub Actions.
#
# Blocks a PR when the training dataset fails a read-only check, and posts the
# findings as a PR comment. No cairn server, no separate Action, just
# `pip install cairndev && cairn run --check …`. Copy this into .github/workflows/, and
# copy templates/dataset-check.md to templates/ at the root of your repository.
name: cairn run --check

on:
  pull_request:
    paths: ['data/**']            # only when the dataset changes (tune to your repo)

jobs:
  dataset-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write        # to post the findings comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cairndev

      # Run the read-only gate. It exits non-zero on FAIL — captured, not fatal
      # yet, so the comment step still runs. The final step re-raises it.
      - name: cairn run --check — dataset check
        id: gate
        run: |
          set +e
          cairn run --check dataset-check \
            --set path=data/train.jsonl \
            --json > gate.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat gate.json

      - name: Comment the cited findings on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(jq -r '.verdict // "error"' gate.json)
          {
            echo "### cairn run --check — \`${verdict}\`  ·  \`dataset-check\`"
            echo
            echo '```json'
            jq '{verdict, blocking, warnings, reasons, error}' gate.json
            echo '```'
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md

      # Block the merge if the gate failed.
      - name: Enforce the gate
        run: exit ${{ steps.gate.outputs.rc }}
